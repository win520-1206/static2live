name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core and Skill recipes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and test dependencies
        run: python -m pip install ".[dev]"
      - name: Check CLI entry points
        run: |
          static2live --version
          static2live --help
          static2live generate --help
          static2live models prepare --help
      - name: Run core and installed CLI tests
        run: python -m pytest -q tests/test_core.py tests/test_skill_workflow.py
